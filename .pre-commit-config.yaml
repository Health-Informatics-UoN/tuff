
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.8
    hooks:
      - id: uv-lock
      - id: uv-export
        args: [--no-dev, --output-file, requirements.txt]