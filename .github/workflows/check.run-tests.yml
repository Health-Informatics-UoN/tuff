name: tuff uv pytest
permissions:
  contents: read
  pull-requests: write

on:
  push: # always run on push
  pull_request: # always run on pull request

jobs:
  pytest:
    name: pytest
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          # we will probably want to use this on our the NUH laptops
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: |
          uv run pytest
