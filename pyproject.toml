[project]
name = "tuff"
version = "0.1.0"
description = "an SQL-CTE linter/inspector"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "sqlglot>=30.31.0",
]

[project.scripts]
tuff = "tuff:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
