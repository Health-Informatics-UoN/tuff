# .forgejo/uv-forgejo/action.yml
name: uv-forgejo
description: an image that can run uv for forgejo
inputs:
  command:
    description: The bash command to run inside the container
    required: true
runs:
  using: docker
  image: Dockerfile
  entrypoint: /bin/bash
  args:
    - "-c"
    - ${{ inputs.command }}
