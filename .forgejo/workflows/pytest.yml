# uv pytest
# ---
name: uv pytest
on:
  push:
    branches:
      - "*"
jobs:
  build:
    runs-on: mini3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: tool versions
        uses: ./.forgejo/uv-forgejo
        with:
          command: |
            uv --version
            node -v
            npm -v
            npx -v

      - name: uv pytest
        uses: ./.forgejo/uv-forgejo
        with:
          command: uv run pytest

      - name: require 59% coverage
        uses: ./.forgejo/uv-forgejo
        with:
          command: |
            uv run coverage run -m pytest
            uv run coverage report --fail-under 59%
